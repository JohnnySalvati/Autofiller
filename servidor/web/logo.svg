<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="AutoFiller">
  <title>AutoFiller</title>
  <!-- Mismo isotipo que el resto de las apps de InSoft: cuadrado redondeado
       oscuro con el glifo en verde. El de AutoFiller es una "A" cuyo travesaño
       se estira más allá de la pata derecha: es el campo que se completa solo. -->
  <rect width="48" height="48" rx="12" fill="#16181c"/>
  <g fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 35 L24 14 L32 35"/>
    <path d="M19.5 28 H33"/>
  </g>
</svg>
